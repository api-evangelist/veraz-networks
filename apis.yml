description: Veraz Networks was a San Jose, California telecommunications infrastructure company (founded
  2001) that supplied VoIP softswitches, media gateways (the I-Gate 4000 family), session bandwidth
  optimizers, and the IP Multimedia Subsystem based ControlSwitch product family to wireline, broadband,
  and wireless service providers in over 50 countries. Veraz merged with Dialogic in 2010; the company no
  longer exists as an independent entity and veraznetworks.com now redirects to dialogic.com. It ships no
  independent public developer API, documentation, SDK, or well-known surface of its own to enrich.
